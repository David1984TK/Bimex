name: 🐛 Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Frontend (bimex-frontend)
        - Contrato Soroban (bimex)
        - Indexer / API (bimex-indexer)
        - CI / infraestructura
        - No estoy seguro
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
      description: Qué pasó y qué esperabas que pasara.
      placeholder: "Al hacer clic en Contribuir con 100 MXNe, la transacción..."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Conectar wallet en testnet
        2. Ir a /proyectos/0
        3. ...
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Navegador/OS, red (testnet/mainnet), wallet (Freighter/xBull/passkey).
      placeholder: "Chrome 130 / macOS, testnet, Freighter"
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, errores de consola, hash de transacción (link a stellar.expert si aplica).
