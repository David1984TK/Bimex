name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  contract:
    name: Contrato Soroban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32v1-none: target requerido por soroban-sdk 27+ (Rust 1.84+);
          # wasm32-unknown-unknown quedó sin soporte en el Soroban Environment.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bimex
      # --locked: CI valida exactamente el Cargo.lock commiteado. Sin esto,
      # cada run re-resuelve dependencias y una release upstream incompatible
      # (o un crate yanked) rompe CI sin que nadie haya tocado el repo
      # (ver postmortem del 2026-07-14: ed25519-dalek 3.0 / spin yanked).
      - name: cargo test
        run: cd bimex && cargo test --locked
      - name: Build wasm (release)
        run: cd bimex && cargo build --release --target wasm32v1-none --locked
      # cargo clippy step moved below
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}-v0.22
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
        working-directory: bimex
      - name: Configure cargo audit ignores
        run: |
          mkdir -p ~/.cargo
          cp bimex/audit.toml ~/.cargo/audit.toml
      - name: Run cargo audit
        run: cargo audit --deny warnings
        working-directory: bimex
      - name: cargo clippy
        run: cd bimex && cargo clippy --locked -- -D warnings

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bimex-frontend/package-lock.json
      - name: Install dependencies
        run: cd bimex-frontend && npm ci
      - name: Audit dependencies
        run: cd bimex-frontend && npm audit --audit-level=high
      - name: Lint
        run: cd bimex-frontend && npm run lint
      - name: Unit tests
        run: cd bimex-frontend && npm run test:run -- --coverage
        env:
          VITE_CONTRACT_ID: PLACEHOLDER_CONTRACT_ID
          VITE_RPC_URL: https://soroban-testnet.stellar.org
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

  indexer:
    name: Indexer Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bimex-indexer/package-lock.json
      - name: Install dependencies
        run: cd bimex-indexer && npm ci
      - name: Audit dependencies
        run: cd bimex-indexer && npm audit --audit-level=high
      - name: Run unit tests
        run: cd bimex-indexer && npm test
