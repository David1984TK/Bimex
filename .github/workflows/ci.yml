name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contrato Soroban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bimex
      
      - name: Run tests
        run: cd bimex && cargo test
      
      - name: Run clippy
        run: cd bimex && cargo clippy -- -D warnings

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bimex-frontend/package-lock.json
      
      - name: Install dependencies
        run: cd bimex-frontend && npm ci
      
      - name: Run linter
        run: cd bimex-frontend && npm run lint
      
      - name: Run tests
        run: cd bimex-frontend && npm run test:run -- --coverage
      
      - name: Build
        run: cd bimex-frontend && npm run build

  indexer:
    name: Indexer Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bimex-indexer/package-lock.json
      
      - name: Install dependencies
        run: cd bimex-indexer && npm ci
      
      - name: Run tests
        run: cd bimex-indexer && npm run test
